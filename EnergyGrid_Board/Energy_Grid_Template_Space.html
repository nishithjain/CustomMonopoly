<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>@@ENERGY_NAME@@ - Energy Grid</title>

    <style>

        /* =========================================================
           RESET
           ========================================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* =========================================================
           VARIABLES
           ========================================================= */

        :root {

            /* EXACT BOARD SPACE SIZE */
            --tile-width: 4.625cm;
            --tile-height: 6.5cm;

            --green-dark: #0d382d;
            --green: #17624f;
            --green-mid: #25856b;

            --gold-light: #fff0a4;
            --gold: #d8ad3e;
            --gold-dark: #9c7019;

            --cream: #fff3c4;

            --black-1: #1c1c1c;
            --black-2: #0d0d0d;
            --black-3: #040404;
        }


        /* =========================================================
           PREVIEW PAGE
           ========================================================= */

        html,
        body {
            min-height: 100%;
        }


        body {

            min-height: 100vh;

            display: grid;
            place-items: center;

            background: #dedbd4;

            font-family:
                Cambria,
                "Times New Roman",
                Georgia,
                serif;
        }


        /* =========================================================
           ENERGY GRID BOARD SPACE

           EXACT SIZE:
           4.625 cm × 6.5 cm
           ========================================================= */

        .energy-grid-tile {

            width: var(--tile-width);
            height: var(--tile-height);

            position: relative;

            overflow: hidden;

            display: flex;
            flex-direction: column;

            background:

                radial-gradient(
                    circle at 50% 10%,
                    rgba(255,255,255,0.07) 0%,
                    rgba(255,255,255,0.02) 27%,
                    transparent 55%
                ),

                linear-gradient(
                    180deg,
                    var(--black-1) 0%,
                    var(--black-2) 58%,
                    var(--black-3) 100%
                );

            border:
                1px solid
                #d9c77d;

            box-shadow:

                inset 0 0 0 0.35mm
                rgba(255,255,255,0.04),

                inset 0 -1.2mm 2.4mm
                rgba(0,0,0,0.48);

            color: var(--cream);
        }


        /* subtle inner frame */

        .energy-grid-tile::before {

            content: "";

            position: absolute;

            inset: 0.08cm;

            border:
                0.02cm solid
                rgba(255,239,178,0.10);

            pointer-events: none;

            z-index: 5;
        }


        /* =========================================================
           TOP ENERGY STRIP
           ========================================================= */

        .energy-strip {

            width: 100%;
            height: 1.05cm;

            flex: 0 0 1.05cm;

            position: relative;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            gap: 0.06cm;

            padding:
                0.08cm
                0.10cm;

            background:

                linear-gradient(
                    180deg,
                    var(--green-mid) 0%,
                    var(--green) 55%,
                    var(--green-dark) 100%
                );

            border-bottom:
                0.035cm solid
                rgba(216,173,62,0.85);

            box-shadow:

                inset 0 0.035cm 0
                rgba(255,255,255,0.14),

                inset 0 -0.045cm 0
                rgba(0,0,0,0.18);
        }


        /* =========================================================
           FOUR BOLTS
           ========================================================= */

        .energy-bolts {

            display: flex;

            align-items: center;
            justify-content: center;

            gap: 0.10cm;

            height: 0.35cm;
        }


        .bolt-icon {

            width: 0.22cm;
            height: 0.30cm;

            display: block;

            color: var(--gold);
        }


        .energy-type-label {

            font-size: 0.22cm;

            font-weight: 700;

            line-height: 1;

            letter-spacing: 0.025cm;

            text-transform: uppercase;

            color: #fff2bc;

            white-space: nowrap;
        }


        /* =========================================================
           BODY
           ========================================================= */

        .energy-body {

            flex: 1 1 auto;

            min-height: 0;

            display: flex;
            flex-direction: column;

            align-items: center;

            padding:
                0.20cm
                0.16cm
                0.20cm;

            text-align: center;
        }


        /* =========================================================
           ARTWORK
           ========================================================= */

        .energy-artwork-frame {

            width: 3.65cm;
            height: 2.65cm;

            flex: 0 0 2.65cm;

            overflow: hidden;

            position: relative;

            border-radius: 0.13cm;

            border:
                0.025cm solid
                rgba(255,232,151,0.55);

            background:

                radial-gradient(
                    circle at 50% 35%,
                    #294f43 0%,
                    #142720 58%,
                    #080d0b 100%
                );

            box-shadow:

                0 0.07cm 0.13cm
                rgba(0,0,0,0.50),

                inset 0 0 0 0.02cm
                rgba(255,255,255,0.05);
        }


        .energy-artwork {

            width: 100%;
            height: 100%;

            display: block;

            object-fit: cover;
            object-position: center;
        }


        /* artwork highlight */

        .energy-artwork-frame::after {

            content: "";

            position: absolute;

            inset: 0;

            pointer-events: none;

            background:

                linear-gradient(
                    135deg,
                    rgba(255,255,255,0.10),
                    transparent 35%,
                    transparent 72%,
                    rgba(0,0,0,0.10)
                );
        }


        /* =========================================================
           ENERGY NAME
           ========================================================= */

        .energy-name {

            width: 100%;

            margin-top: 0.23cm;

            min-height: 0.82cm;

            display: flex;

            align-items: center;
            justify-content: center;

            text-align: center;

            font-size: 0.43cm;

            font-weight: 700;

            line-height: 0.95;

            letter-spacing: 0.012cm;

            text-transform: uppercase;

            color: #fff2c4;

            text-shadow:

                0 0.025cm 0.04cm
                rgba(0,0,0,0.80);
        }


        /* use for HYDROELECTRIC ENERGY */

        .energy-name.long-name {

            font-size: 0.37cm;

            line-height: 0.96;
        }


        /* =========================================================
           PURCHASE PRICE
           ========================================================= */

        .energy-price {

            margin-top: auto;

            min-width: 2.65cm;

            padding:
                0.10cm
                0.22cm
                0.09cm;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 0.10cm;

            background:

                linear-gradient(
                    180deg,
                    rgba(255,239,175,0.10),
                    rgba(216,173,62,0.055)
                );

            border-top:
                0.022cm solid
                rgba(255,238,175,0.28);

            border-bottom:
                0.022cm solid
                rgba(0,0,0,0.55);

            color: #ffe89d;

            font-size: 0.52cm;

            font-weight: 700;

            line-height: 1;

            letter-spacing: 0.01cm;

            text-shadow:

                0 0.025cm 0.035cm
                rgba(0,0,0,0.65);
        }


        .energy-price .currency {

            margin-right: 0.025cm;
        }


        /* =========================================================
           SMALL ID
           ========================================================= */

        .energy-id {

            position: absolute;

            bottom: 0.08cm;
            right: 0.10cm;

            z-index: 3;

            font-size: 0.13cm;

            letter-spacing: 0.01cm;

            color:
                rgba(255,255,255,0.30);
        }


        /* =========================================================
           SVG DEFINITIONS
           ========================================================= */

        .svg-definitions {

            position: absolute;

            width: 0;
            height: 0;

            overflow: hidden;
        }


        /* =========================================================
           PRINT
           ========================================================= */

        @page {

            size:
                4.625cm
                6.5cm;

            margin: 0;
        }


        @media print {

            html,
            body {

                width: 4.625cm;
                height: 6.5cm;
            }


            body {

                margin: 0;
                padding: 0;

                background: white;
            }


            .energy-grid-tile {

                width: 4.625cm;
                height: 6.5cm;

                box-shadow: none;

                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

        }

    </style>

</head>


<body>


<!-- =============================================================
     REUSABLE LIGHTNING SYMBOL
     ============================================================= -->

<svg class="svg-definitions"
     xmlns="http://www.w3.org/2000/svg">

    <symbol
        id="lightning-bolt"
        viewBox="0 0 24 32">

        <path
            fill="currentColor"
            d="
                M14.6 0
                L3.2 17.1
                H10
                L7.8 32
                L20.8 12.6
                H13.8
                Z
            ">
        </path>

    </symbol>

</svg>



<!-- =============================================================
     ENERGY GRID SPACE
     ============================================================= -->

<div class="energy-grid-tile">


    <!-- TOP STRIP -->

    <div class="energy-strip">


        <div class="energy-bolts">

            <svg class="bolt-icon">
                <use href="#lightning-bolt"></use>
            </svg>

            <svg class="bolt-icon">
                <use href="#lightning-bolt"></use>
            </svg>

            <svg class="bolt-icon">
                <use href="#lightning-bolt"></use>
            </svg>

            <svg class="bolt-icon">
                <use href="#lightning-bolt"></use>
            </svg>

        </div>


        <div class="energy-type-label">
            Renewable Energy Grid
        </div>


    </div>



    <!-- BODY -->

    <div class="energy-body">


        <!-- ARTWORK -->

        <div class="energy-artwork-frame">

            <img
                class="energy-artwork"
                src="@@ENERGY_IMAGE@@"
                alt="@@ENERGY_NAME@@">

        </div>



        <!-- NAME -->

        <div class="energy-name">
            @@ENERGY_NAME@@
        </div>



        <!-- PURCHASE PRICE -->

        <div class="energy-price">

            <span class="currency">₹</span>

            <span>
                @@PURCHASE_PRICE@@
            </span>

        </div>


    </div>



    <!-- INTERNAL ID -->

    <div class="energy-id">
        @@ENERGY_GRID_ID@@
    </div>


</div>


</body>

</html>
