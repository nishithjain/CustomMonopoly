[build-system]
requires = ["setuptools==75.8.2", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "monopoly-edition-generator"
version = "1.0.0"
description = "Generate Monopoly property cards, event cards, and board art from edition JSON."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "customtkinter==6.0.0",
    "pillow==12.0.0",
    "playwright==1.62.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[project.scripts]
monopoly-generate = "monopoly_edition_generator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
