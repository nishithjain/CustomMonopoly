<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RANN OF KUTCH · Monopoly Property Card</title>
  <style>
    /* ----- reset & base ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #c0b7a8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: Cambria, "Times New Roman", serif;
      padding: 20px;
    }

    /* ----- CARD CONTAINER: 108mm × 172mm ----- */
    .property-card {
      width: 108mm;
      height: 172mm;
      background: white;
      border-radius: 6mm;
      border: 1.6px solid #24201b;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.22);
      padding: 5mm;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
    }

    /* ----- DRY CONTENT WRAPPER -----
       Fill the card's inner content area so .spacer-top can absorb
       remaining vertical space. This keeps the rent table exactly at
       the card's 5mm bottom padding, matching the 5mm top padding. */
    #cardContent {
      display: flex;
      flex-direction: column;
      flex: 1 1 auto;
      min-height: 0;
      height: 100%;
    }

    /* ----- design tokens ----- */
    :root {
      --property-dark: #32794E;
      --property-light: #51A172;
      --rent-row-1: #ECF5EF, #E0EEE6;
      --rent-row-2: #D8EAE0, #C9E2D3;
      --rent-row-3: #C1DECD, #AED3BD;
      --rent-row-4: #A6CFB7, #8FC3A4;
      --rent-row-5: #87BF9E, #70B28B;
      --heading-color: #403b36;
      --rent-border: #c9bbae;
      --diamond-border: #292622;
      --text-dark: #111;
      --text-light: #fff;
      --color-height: 32mm;
      --rent-table-height: 75mm;
      --row-height: 15mm;
      --font-serif: Cambria, "Times New Roman", serif;
    }

    /* ----- HEADER ----- */
    .color-section {
      background: linear-gradient(145deg, var(--property-dark), var(--property-light) 55%, var(--property-dark));
      border-radius: 4mm;
      flex: 0 0 var(--color-height);
      height: var(--color-height);
      min-height: var(--color-height);
      max-height: var(--color-height);
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
    }

    .coin {
      width: 20mm;
      height: 20mm;
      border-radius: 50%;
      background: radial-gradient(circle at 32% 28%, #f7df76, #d7a52a 72%, #b9801d);
      box-shadow: 0 0.7mm 1.4mm rgba(0,0,0,0.26), inset 0 -0.35mm 0.8mm rgba(0,0,0,0.16);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      border: 0.65mm solid #d7a438;
      flex-shrink: 0;
    }
    .coin::after {
      content: "";
      position: absolute;
      top: 10%;
      left: 15%;
      width: 35%;
      height: 28%;
      background: radial-gradient(circle, rgba(255,255,240,0.5) 5%, transparent 80%);
      border-radius: 50%;
      pointer-events: none;
    }
    .coin-number {
      font-size: 11mm;
      font-weight: 900;
      color: #1a1a1a;
      text-shadow: 0.4mm 0.6mm 0 rgba(0,0,0,0.15);
      line-height: 1;
      letter-spacing: -0.4mm;
      font-family: var(--font-serif);
      margin-top: 0.2mm;
    }

    /* ----- PROPERTY NAME ----- */
    .property-title {
      text-align: center;
      margin-top: 4.2mm;
      margin-bottom: 3.2mm;
      line-height: 0.95;
      flex: 0 0 auto;
    }
    .property-title .line {
      font-weight: 900;
      letter-spacing: 0.7mm;
      word-spacing: 0.8mm;
      display: block;
      font-family: var(--font-serif);
      color: var(--text-dark);
      font-size: 8.5mm;
    }
    .property-title .line2 {
      font-size: 8mm;
      letter-spacing: 1.0mm;
    }

    /* ----- PURCHASE PRICE ----- */
    .purchase-price {
      text-align: center;
      font-family: var(--font-serif);
      color: var(--text-dark);
      margin-top: 0.3mm;
      margin-bottom: 0mm;
      flex: 0 0 auto;
      letter-spacing: 0.18mm;
    }
    .purchase-price .label {
      font-size: 3.6mm;
      font-weight: 700;
      color: #5b554f;
      letter-spacing: 0.25mm;
      margin-right: 1.1mm;
    }
    .purchase-price .price-value {
      font-size: 5.3mm;
      font-weight: 900;
      display: inline-block;
    }
    .money-symbol {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1em;
      font-weight: 900;
      margin-right: 0.2mm;
      line-height: 1;
      color: var(--text-dark);
    }
    .money-symbol .currency-char {
      display: inline-block;
      font-weight: 900;
      font-family: var(--font-serif);
    }

    /* ----- SPACER ----- */
    .spacer-top {
      flex: 1 1 0;
      min-height: 1mm;
    }

    /* ----- RENT AREA ----- */
    .rent-area {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
    }

    .rent-heading {
      display: grid;
      grid-template-columns: 62% 38%;
      padding: 1.6mm 0.8mm 1.4mm 0.8mm;
      background: #f3eee8;
      border: 0.8px solid var(--rent-border);
      border-bottom: none;
      border-radius: 2mm 2mm 0 0;
      flex: 0 0 auto;
    }
    .rent-heading span {
      font-size: 3.4mm;
      font-weight: 700;
      letter-spacing: 0.28mm;
      color: var(--heading-color);
      font-family: var(--font-serif);
      text-align: center;
    }
    .rent-heading .right {
      padding-right: 0.5mm;
    }

    .rent-table {
      display: flex;
      flex-direction: column;
      flex: 0 0 var(--rent-table-height);
      height: var(--rent-table-height);
      border-radius: 0 0 2mm 2mm;
      overflow: hidden;
      border: 0.8px solid var(--rent-border);
      width: 100%;
    }

    .rent-row {
      display: grid;
      grid-template-columns: 62% 38%;
      align-items: center;
      padding: 0 0.8mm;
      flex: 0 0 var(--row-height);
      height: var(--row-height);
      min-height: var(--row-height);
      border-bottom: 0.6px solid rgba(93,70,47,0.20);
    }
    .rent-row:last-child {
      border-bottom: none;
    }

    .rent-row.row-1 { background: linear-gradient(145deg, var(--rent-row-1)); }
    .rent-row.row-2 { background: linear-gradient(145deg, var(--rent-row-2)); }
    .rent-row.row-3 { background: linear-gradient(145deg, var(--rent-row-3)); }
    .rent-row.row-4 { background: linear-gradient(145deg, var(--rent-row-4)); }
    .rent-row.row-5 { background: linear-gradient(145deg, var(--rent-row-5)); }

    .diamond-group {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.2mm;
    }
    .level-diamond {
      width: 6.6mm;
      height: 6.6mm;
      display: flex;
      justify-content: center;
      align-items: center;
      transform: rotate(45deg);
      border: 0.55mm solid var(--diamond-border);
      border-radius: 0.9mm;
      background: rgba(255,255,255,0.34);
      flex-shrink: 0;
    }
    .level-diamond.active {
      background: #1b1917 !important;
      border: 0.55mm solid #1b1917;
      box-shadow: 0 0.25mm 0.7mm rgba(0,0,0,0.20);
    }
    .level-diamond span {
      transform: rotate(-45deg);
      font-size: 3.2mm;
      font-weight: 900;
      color: var(--text-dark);
      line-height: 1;
      font-family: var(--font-serif);
      display: inline-block;
    }
    .level-diamond.active span {
      color: var(--text-light);
    }

    .rent-value {
      font-size: 5.35mm;
      font-weight: 900;
      font-family: var(--font-serif);
      color: var(--text-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.3mm;
      padding-right: 0.5mm;
      letter-spacing: 0.3mm;
    }

    @media print {
      body { background: white; padding: 0; }
      .property-card {
        box-shadow: none;
        border: 2px solid #1e1e1e;
        page-break-inside: avoid;
        width: 108mm;
        height: 172mm;
      }
    }
  </style>
</head>
<body>
<div class="property-card" id="app">
  <!-- All content is generated by JavaScript from CARD_DATA -->
  <div id="cardContent"></div>
</div>

<script>
  // ============================================================
  //  SINGLE SOURCE OF TRUTH — change this to create any card
  // ============================================================
  const CARD_DATA = {
      "currency": "₹",
      "labels": {
          "purchasePrice": "Purchase Price",
          "rentLevel": "RENT LEVEL",
          "rent": "RENT"
      },
      "property": {
          "number": 19,
          "name": [
              "RANN OF",
              "KUTCH"
          ],
          "purchasePrice": 30000
      },
      "rentLevels": [
          {
              "level": 1,
              "rent": 23000
          },
          {
              "level": 2,
              "rent": 32000
          },
          {
              "level": 3,
              "rent": 46000
          },
          {
              "level": 4,
              "rent": 70000
          },
          {
              "level": 5,
              "rent": 140000
          }
      ]
  };

  // ============================================================
  //  RENDER FUNCTIONS
  // ============================================================

  // Currency formatter
  function renderCurrency(value) {
    return `<span class="money-symbol"><span class="currency-char">${CARD_DATA.currency}</span></span>${value}`;
  }

  // Property title (supports any number of lines)
  function renderPropertyTitle(nameArray) {
    return nameArray.map((line, index) => {
      const extraClass = index === 1 ? ' line2' : '';
      return `<span class="line${extraClass}">${line}</span>`;
    }).join('');
  }

  // Diamonds (5 diamonds, one active based on level)
  function renderDiamonds(activeLevel, total = 5) {
    let html = '';
    for (let i = 1; i <= total; i++) {
      const activeClass = i === activeLevel ? 'active' : '';
      html += `<div class="level-diamond ${activeClass}"><span>${i}</span></div>`;
    }
    return html;
  }

  // Single rent row
  function renderRentRow(rentData, rowIndex) {
    const rowClass = `row-${rowIndex + 1}`;
    return `
      <div class="rent-row ${rowClass}">
        <div class="diamond-group">${renderDiamonds(rentData.level)}</div>
        <div class="rent-value">${renderCurrency(rentData.rent)}</div>
      </div>
    `;
  }

  // Full card render
  function renderCard() {
    const container = document.getElementById('cardContent');

    container.innerHTML = `
      <!-- HEADER + COIN -->
      <div class="color-section">
        <div class="coin"><span class="coin-number">${CARD_DATA.property.number}</span></div>
      </div>

      <!-- PROPERTY TITLE -->
      <div class="property-title">
        ${renderPropertyTitle(CARD_DATA.property.name)}
      </div>

      <!-- PURCHASE PRICE -->
      <div class="purchase-price">
        <span class="label">${CARD_DATA.labels.purchasePrice}</span>
        <span class="price-value">${renderCurrency(CARD_DATA.property.purchasePrice)}</span>
      </div>

      <div class="spacer-top"></div>

      <!-- RENT AREA -->
      <div class="rent-area">
        <div class="rent-heading">
          <span class="left">${CARD_DATA.labels.rentLevel}</span>
          <span class="right">${CARD_DATA.labels.rent}</span>
        </div>
        <div class="rent-table">
          ${CARD_DATA.rentLevels.map((row, index) => renderRentRow(row, index)).join('')}
        </div>
      </div>
    `;
  }

  // ============================================================
  //  BOOT
  // ============================================================
  document.addEventListener('DOMContentLoaded', renderCard);
</script>
</body>
</html>
